name: Build and Release

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Devbox
      uses: jetpack-io/devbox-install-action@v0.11.0
    
    - name: Cache Devbox packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/devbox
          ~/.nix-profile
          /nix
        key: ${{ runner.os }}-devbox-${{ hashFiles('devbox.json', 'devbox.lock') }}
        restore-keys: |
          ${{ runner.os }}-devbox-
    
    - name: Build custom kernel
      run: |
        echo "Building custom kernel..."
        devbox run build-kernel
    
    - name: Build ISO
      run: devbox run build
    
    - name: Generate SHA256 checksum
      run: |
        sha256sum disk-wiper.iso > disk-wiper.iso.sha256
        cat disk-wiper.iso.sha256
    
    - name: Set release version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Use tag name for tagged releases
          VERSION="${{ github.ref_name }}"
        else
          # Use date-based version for dev branch
          VERSION="dev-$(date +'%Y%m%d-%H%M%S')"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: "Disk Wiper ${{ steps.version.outputs.version }}"
        files: |
          disk-wiper.iso
          disk-wiper.iso.sha256
        body: |
          # Universal Disk Wiper ${{ steps.version.outputs.version }}
          
          ## ⚠️ WARNING
          
          **This ISO will IMMEDIATELY and AUTOMATICALLY wipe ALL internal hard drives when booted!**
          
          - No confirmation prompts
          - No user interaction required
          - Wipes begin immediately after boot
          - ALL data will be PERMANENTLY DESTROYED
          
          ## Download
          
          - `disk-wiper.iso` - Bootable ISO image
          - `disk-wiper.iso.sha256` - SHA256 checksum
          
          ## Verify Download
          
          ```bash
          sha256sum -c disk-wiper.iso.sha256
          ```
          
          ## Usage
          
          1. Write ISO to USB drive: `sudo dd if=disk-wiper.iso of=/dev/sdX bs=4M status=progress`
          2. Boot target system from USB
          3. System will automatically wipe all internal drives
          4. System will power off when complete
          
          ## Testing
          
          **ONLY test in isolated VMs!**
          
          ```bash
          # BIOS mode
          qemu-system-x86_64 -m 2048 -cdrom disk-wiper.iso -hda test-disk.img
          
          # UEFI mode  
          qemu-system-x86_64 -m 2048 -cdrom disk-wiper.iso -hda test-disk.img -bios /usr/share/ovmf/OVMF.fd
          ```
          
          ---
          
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && '**This is an automated development build**' || '' }}
          
          Commit: ${{ github.sha }}
        draft: false
        prerelease: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: disk-wiper-iso-${{ github.sha }}
        path: |
          disk-wiper.iso
          disk-wiper.iso.sha256
        retention-days: 7